[project]
name = "erp-webcam-backend"
version = "0.1.0"
description = "Multi-tenant ERP SaaS backend for webcam studio management"
authors = [{ name = "ERP Team" }]
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[tool.poetry]
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.136.0"
starlette = "^0.49.1"
uvicorn = { version = "^0.32.0", extras = ["standard"] }
sqlalchemy = { version = "^2.0.0", extras = ["asyncio"] }
asyncpg = "^0.30.0"
alembic = "^1.14.0"
pydantic = "^2.0.0"
pydantic-settings = "^2.0.0"
redis = "^5.0.0"
arq = "^0.26.0"
playwright = "^1.48.0"
argon2-cffi = "^23.1.0"
python-jose = { version = "^3.3.0", extras = ["cryptography"] }
cryptography = "^46.0.7"
httpx = "^0.27.0"
pyotp = "^2.9.0"
qrcode = { version = "^7.4.0", extras = ["pil"] }
email-validator = "^2.0.0"
bleach = { version = "^6.2.0", extras = ["css"] }
reportlab = "^4.2.0"
# Pinned for CVEs (transitive otherwise)
protobuf = "^5.29.6"  # GHSA-7gcm-g887-7qv7
mako = "^1.3.11"  # GHSA-v92g-xgxw-vvmm (alembic transitive)

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pytest-asyncio = "^1.0.0"
ruff = "^0.8.0"
pre-commit = "^4.0.0"
aiosqlite = "^0.22.1"
fakeredis = "^2.34.1"
bandit = { version = "^1.8.0", extras = ["toml"] }
pip-audit = "^2.7.3"
semgrep = "^1.100.0"
detect-secrets = "^1.5.0"
import-linter = "~2.3"

[tool.bandit]
exclude_dirs = ["tests", ".venv", "alembic/versions"]
skips = ["B101"]  # assert_used — fine in tests/internal

# --- Architecture boundaries (modular monolith). Run: `make lint-arch`.
# See docs/architecture.md for the rules behind these contracts.
[tool.importlinter]
root_packages = ["app"]
include_external_packages = false

[[tool.importlinter.contracts]]
name = "shared is infrastructure: it must not depend on domain modules or the composition root"
type = "forbidden"
source_modules = ["app.shared"]
forbidden_modules = ["app.modules", "app.models_registry", "app.routes", "app.main"]

[[tool.importlinter.contracts]]
name = "modules are independent except through the allowed public APIs listed here"
type = "independence"
modules = [
    "app.modules.identity",
    "app.modules.studio",
    "app.modules.shifts",
    "app.modules.payroll",
    "app.modules.insights",
    "app.modules.notifications",
    "app.modules.extension",
    "app.modules.automation",
    "app.modules.health",
]
# Allowed cross-module dependencies. The right-hand side is always a package
# root (its __init__ is the public API); importing internals such as
# `app.modules.identity.models.user` from another module is a violation.
ignore_imports = [
    "app.modules.studio.** -> app.modules.identity",
    "app.modules.shifts.** -> app.modules.identity",
    "app.modules.shifts.** -> app.modules.studio",
    "app.modules.payroll.** -> app.modules.identity",
    "app.modules.payroll.** -> app.modules.shifts",
    "app.modules.insights.** -> app.modules.identity",
    "app.modules.insights.** -> app.modules.studio",
    "app.modules.insights.** -> app.modules.shifts",
    "app.modules.insights.** -> app.modules.payroll",
    "app.modules.notifications.** -> app.modules.identity",
    "app.modules.extension.** -> app.modules.identity",
    "app.modules.extension.** -> app.modules.studio",
]

[[tool.importlinter.contracts]]
name = "inside a module: router -> dependencies -> service -> schemas -> models"
type = "layers"
containers = [
    "app.modules.identity",
    "app.modules.studio",
    "app.modules.shifts",
    "app.modules.payroll",
    "app.modules.insights",
    "app.modules.notifications",
    "app.modules.extension",
    "app.modules.automation",
    "app.modules.health",
]
layers = [
    "(router) | (routers)",
    "(dependencies)",
    "(service) | (services)",
    "(schemas)",
    "(models)",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
